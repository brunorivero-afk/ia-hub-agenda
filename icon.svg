<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="#0a1628"/>

  <!-- Calendar body -->
  <rect x="72" y="148" width="368" height="296" rx="24" fill="#ffffff"/>

  <!-- Header bar -->
  <rect x="72" y="148" width="368" height="96" rx="24" fill="#d4a017"/>
  <rect x="72" y="200" width="368" height="44" fill="#d4a017"/>

  <!-- Ring posts -->
  <rect x="168" y="108" width="28" height="84" rx="14" fill="#f5f0e8"/>
  <rect x="316" y="108" width="28" height="84" rx="14" fill="#f5f0e8"/>

  <!-- Header text: "RES" suggesting reservas -->
  <text x="256" y="207" text-anchor="middle" font-family="system-ui,sans-serif" font-size="30" font-weight="800" fill="#0a1628" letter-spacing="1">AGENDA IA HUB</text>

  <!-- Grid lines vertical -->
  <line x1="72" y1="296" x2="440" y2="296" stroke="#e8e4dc" stroke-width="2"/>
  <line x1="72" y1="352" x2="440" y2="352" stroke="#e8e4dc" stroke-width="2"/>
  <line x1="72" y1="408" x2="440" y2="408" stroke="#e8e4dc" stroke-width="2"/>
  <line x1="177" y1="244" x2="177" y2="444" stroke="#e8e4dc" stroke-width="2"/>
  <line x1="282" y1="244" x2="282" y2="444" stroke="#e8e4dc" stroke-width="2"/>
  <line x1="387" y1="244" x2="387" y2="444" stroke="#e8e4dc" stroke-width="2"/>

  <!-- Day dots row 1 -->
  <circle cx="125" cy="270" r="14" fill="#e8e4dc"/>
  <circle cx="230" cy="270" r="14" fill="#e8e4dc"/>
  <circle cx="335" cy="270" r="14" fill="#e8e4dc"/>
  <circle cx="414" cy="270" r="14" fill="#e8e4dc"/>

  <!-- Day dots row 2 — highlighted today -->
  <circle cx="125" cy="324" r="22" fill="#0a1628"/>
  <text x="125" y="332" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#d4a017">22</text>
  <circle cx="230" cy="324" r="14" fill="#e8e4dc"/>
  <circle cx="335" cy="324" r="14" fill="#d4a017" opacity="0.6"/>
  <circle cx="414" cy="324" r="14" fill="#e8e4dc"/>

  <!-- Day dots row 3 -->
  <circle cx="125" cy="380" r="14" fill="#e8e4dc"/>
  <circle cx="230" cy="380" r="14" fill="#e8e4dc"/>
  <circle cx="335" cy="380" r="14" fill="#e8e4dc"/>
  <circle cx="414" cy="380" r="14" fill="#d4a017" opacity="0.6"/>

  <!-- Day dots row 4 -->
  <circle cx="125" cy="425" r="14" fill="#e8e4dc"/>
  <circle cx="230" cy="425" r="14" fill="#e8e4dc"/>
  <circle cx="335" cy="425" r="14" fill="#e8e4dc"/>
  <circle cx="414" cy="425" r="14" fill="#e8e4dc"/>
</svg>
